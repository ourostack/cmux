name: Shepherd SDK notification component

on:
  push:
    branches:
      - worker/shepherd-v1-ci-sdk-forwarding-green-20261020

permissions:
  contents: read

jobs:
  sdk-source-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify only the notification component in a fresh owned stage
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import urllib.request

          expected = "9c92f9e8efa0820186cb2dc25d3c38f22b47b9d64f48dd6dd9a3eadf9a4566ae"
          commit, run_id = os.environ["GITHUB_SHA"], os.environ["GITHUB_RUN_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit) or not run_id.isdecimal():
              raise RuntimeError("Invalid exact CI identity")
          base = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          root = base / f"shepherd-sdk-red-{run_id}"
          root.mkdir()
          payload = root / "payload"
          payload.mkdir()
          with (root / "owner.json").open("x") as out:
              json.dump({"run": run_id, "commit": commit}, out)

          def fetch(name, limit):
              url = f"https://raw.githubusercontent.com/ourostack/cmux/{commit}/.ci/shepherd/{name}"
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise RuntimeError("CI payload download exceeds bound")
              return data

          raw = fetch("snapshot.json", 65536)
          if hashlib.sha256(raw).hexdigest() != expected:
              raise RuntimeError("Exact CI snapshot manifest mismatch")
          manifest = json.loads(raw)
          if (manifest["repository"] != "ourostack/cmux"
                  or manifest["upstream_commit"] != "6b9826e3aa83b1a5947db50f4332cb9c65f1b340"
                  or manifest["upstream_tree"] != "74ba48a4b6b086beb9226a79ffe0f3d9f6d40f52"
                  or manifest["qualification"] is not False):
              raise RuntimeError("Foreign CI snapshot")
          if set(manifest["files"]) != {
                  "LICENSE.codex", "NOTICE.codex", "build-managed-codex-host.py",
                  "managed-codex-frozen-host.patch", "provenance.json", "runner.py"}:
              raise RuntimeError("Unexpected CI payload file")
          with (payload / "snapshot.json").open("xb") as out:
              out.write(raw)
          for name, record in manifest["files"].items():
              data = fetch(name, 131072)
              if len(data) != record["bytes"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise RuntimeError(f"Exact CI blob mismatch: {name}")
              with (payload / name).open("xb") as out:
                  out.write(data)
          os.execv(sys.executable, [sys.executable, "-B", str(payload / "runner.py"),
                                   "--root", str(root)])
          PY
