# Temporary: rewinds main behind workflow-changing upstream commits so the next
# sync proves whether GITHUB_TOKEN may fast-forward over .github/workflows changes.
name: Probe (temporary)
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
permissions:
  contents: write
jobs:
  rewind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/main" -f sha="${{ inputs.sha }}" -F force=true
