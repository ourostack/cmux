# Keeps this fork in step with manaflow-ai/cmux:
#   main          fast-forwarded to upstream main (pure mirror, never committed to here)
#   tags v*       mirrored from upstream
#   ouro-patches  our patch stack, rebased onto upstream main; a conflict opens one issue
#
# Ref updates go through the REST API on the fork network's shared objects, so
# nothing is cloned unless ouro-patches carries commits. Pushes made with
# GITHUB_TOKEN do not trigger workflows, so upstream's own workflows never run here.
# If GitHub ever refuses GITHUB_TOKEN (for example over workflow-file changes),
# add a repo secret FORK_SYNC_TOKEN (fine-grained PAT, ourostack/cmux only,
# Contents + Workflows read/write) and it is used for ref updates automatically.
name: Upstream sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM: manaflow-ai/cmux
      REPO: ${{ github.repository }}
      PATCH_BRANCH: ouro-patches
      CONFLICT_TITLE: "Upstream sync: ouro-patches does not rebase cleanly"
      REF_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      ISSUE_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve upstream main
        id: up
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$UPSTREAM.git" refs/heads/main | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream main: $sha"

      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ env.REF_TOKEN }}
          UP_MAIN: ${{ steps.up.outputs.sha }}
        run: |
          set -euo pipefail
          cur=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$cur" = "$UP_MAIN" ]; then echo "main already at $UP_MAIN"; exit 0; fi
          # force=false makes this fast-forward only: a diverged main fails loudly.
          if gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$UP_MAIN" -F force=false --jq .object.sha; then
            echo "main: $cur -> $UP_MAIN (ref update)"
          else
            echo "::warning::ref update refused; trying merge-upstream"
            gh api -X POST "repos/$REPO/merge-upstream" -f branch=main
          fi
          echo "main now $(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"

      - name: Mirror v* tags
        env:
          GH_TOKEN: ${{ env.REF_TOKEN }}
        run: |
          set -euo pipefail
          git ls-remote --tags "https://github.com/$UPSTREAM.git" 'refs/tags/v*' \
            | grep -v '\^{}$' | awk '{print $2" "$1}' | sort > up.txt
          gh api --paginate "repos/$REPO/git/matching-refs/tags/v" \
            --jq '.[] | "\(.ref) \(.object.sha)"' | sort > fork.txt
          created=0 moved=0 failed=0
          while read -r ref sha; do
            have=$(awk -v r="$ref" '$1==r {print $2}' fork.txt)
            if [ -z "$have" ]; then
              gh api -X POST "repos/$REPO/git/refs" -f ref="$ref" -f sha="$sha" --silent \
                && created=$((created+1)) || { failed=$((failed+1)); echo "::warning::create $ref failed"; }
            elif [ "$have" != "$sha" ]; then
              gh api -X PATCH "repos/$REPO/git/${ref#refs/}" -f sha="$sha" -F force=true --silent \
                && moved=$((moved+1)) || { failed=$((failed+1)); echo "::warning::move $ref failed"; }
            fi
          done < up.txt
          echo "tags: $(wc -l < up.txt) upstream, $created created, $moved moved, $failed failed"
          test "$failed" -eq 0

      - name: Rebase ouro-patches
        id: patches
        env:
          GH_TOKEN: ${{ env.REF_TOKEN }}
          UP_MAIN: ${{ steps.up.outputs.sha }}
        run: |
          set -euo pipefail
          if ! cur=$(gh api "repos/$REPO/git/ref/heads/$PATCH_BRANCH" --jq .object.sha 2>/dev/null); then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$PATCH_BRANCH" -f sha="$UP_MAIN" --silent
            echo "$PATCH_BRANCH created at $UP_MAIN"; exit 0
          fi
          read -r ahead base < <(gh api "repos/$REPO/compare/$UP_MAIN...$cur" --jq '"\(.ahead_by) \(.merge_base_commit.sha)"')
          if [ "$ahead" -eq 0 ]; then
            # Empty patch stack: just move the branch to upstream main.
            [ "$cur" = "$UP_MAIN" ] || gh api -X PATCH "repos/$REPO/git/refs/heads/$PATCH_BRANCH" -f sha="$UP_MAIN" -F force=true --silent
            echo "$PATCH_BRANCH (no patches) at $UP_MAIN"; exit 0
          fi
          if [ "$base" = "$UP_MAIN" ]; then echo "$PATCH_BRANCH already on upstream main ($ahead patches)"; exit 0; fi
          echo "Replaying $ahead patch(es) from $base onto $UP_MAIN"
          url="https://x-access-token:${GH_TOKEN}@github.com/$REPO.git"
          git init -q --bare work && cd work
          git config remote.origin.url "$url"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --filter=blob:none --depth=$((ahead + 1)) origin "+refs/heads/$PATCH_BRANCH:refs/heads/$PATCH_BRANCH"
          git fetch -q --filter=blob:none --depth=1 origin "$UP_MAIN"
          if ! out=$(git replay --onto "$UP_MAIN" "$base..refs/heads/$PATCH_BRANCH" 2>replay.err); then
            { echo "git replay of $base..$cur onto $UP_MAIN stopped:"; cat replay.err; } > ../failure.txt
            cat ../failure.txt; exit 1
          fi
          [ -z "$out" ] || printf '%s\n' "$out" | git update-ref --stdin
          new=$(git rev-parse "refs/heads/$PATCH_BRANCH")
          if ! git push --force-with-lease="$PATCH_BRANCH:$cur" origin "$new:refs/heads/$PATCH_BRANCH" 2>push.err; then
            { echo "push of rebased $PATCH_BRANCH ($new) was refused:"; cat push.err; } > ../failure.txt
            cat ../failure.txt; exit 1
          fi
          echo "$PATCH_BRANCH: $cur -> $new"

      - name: Report patch-stack trouble in one issue
        if: always() && steps.patches.outcome == 'failure'
        env:
          GH_TOKEN: ${{ env.ISSUE_TOKEN }}
        run: |
          set -euo pipefail
          body="The scheduled sync could not rebase \`$PATCH_BRANCH\` onto upstream main.

          Run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID

          \`\`\`
          $(cat failure.txt 2>/dev/null || echo 'see run log')
          \`\`\`

          Rebase \`$PATCH_BRANCH\` by hand (or fix the patch) and push; the next sync closes this issue."
          n=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$CONFLICT_TITLE\")][0].number // empty")
          if [ -n "$n" ]; then
            gh api -X POST "repos/$REPO/issues/$n/comments" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues" -f title="$CONFLICT_TITLE" -f body="$body" --silent
          fi

      - name: Close resolved issue
        if: success()
        env:
          GH_TOKEN: ${{ env.ISSUE_TOKEN }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$CONFLICT_TITLE\")][0].number // empty")
          [ -z "$n" ] || gh api -X PATCH "repos/$REPO/issues/$n" -f state=closed -f state_reason=completed --silent
